name: Shell regression checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Lint shell scripts
        run: shellcheck -S warning Snell.sh Snell-docker.sh tests/ci/*.sh
  regression:
    runs-on: ${{ matrix.runner }}
    # Rocky 8 镜像源偶尔很慢，构建测试镜像可能远超其他发行版。
    timeout-minutes: ${{ contains(matrix.image, 'rockylinux') && 25 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: [debian:bookworm-slim, ubuntu:24.04, quay.io/centos/centos:stream9, quay.io/centos/centos:stream10, quay.io/rockylinux/rockylinux:8, alpine:3.22, alpine:edge]
    steps:
      - uses: actions/checkout@v6
      - name: Download official cores for interoperability checks
        run: |
          source ./Snell.sh
          server_arch=$(get_architecture)
          client_arch=amd64
          if [ "$server_arch" = aarch64 ]; then client_arch=arm64; fi
          mkdir -p "$RUNNER_TEMP/snell-cores"
          timeout -k 5 180 wget --timeout=15 --tries=3 --waitretry=2 "$(snell_download_url "$server_arch")" -O "$RUNNER_TEMP/snell-cores/snell.zip"
          unzip -o "$RUNNER_TEMP/snell-cores/snell.zip" snell-server -d "$RUNNER_TEMP/snell-cores"
          # Pin the independent test client; this does not set the installed Snell version.
          curl -fL --retry 2 --connect-timeout 10 --max-time 180 "https://github.com/SagerNet/sing-box/releases/download/v1.14.2/sing-box-1.14.2-linux-${client_arch}.tar.gz" -o "$RUNNER_TEMP/snell-cores/client.tar.gz"
          tar -xzf "$RUNNER_TEMP/snell-cores/client.tar.gz" -C "$RUNNER_TEMP/snell-cores" --strip-components=1 "sing-box-1.14.2-linux-${client_arch}/sing-box"
          chmod 755 "$RUNNER_TEMP/snell-cores/snell-server" "$RUNNER_TEMP/snell-cores/sing-box"
      - name: Check regression behavior, proxy traffic and real service managers
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: bash tests/ci/run.sh
