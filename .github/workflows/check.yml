name: Shell regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm-slim, ubuntu:24.04, alpine:3.22]
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and regression behavior
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$TEST_IMAGE" sh -ec '
            if command -v apk >/dev/null; then
              apk add --no-cache bash python3 coreutils iproute2 logrotate
            else
              apt-get update
              apt-get install -y --no-install-recommends bash python3 coreutils iproute2 logrotate
            fi
            bash -n Snell.sh
            bash -n Snell-docker.sh
            python3 -m unittest discover -s tests -v
          '
